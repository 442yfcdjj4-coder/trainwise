border-radius:12px;padding:12px;font-size:13px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button{border:1px solid #ddd;background:white;padding:9px 11px;border-radius:10px}.choice button.sel{background:#222;color:#fff}.bigmetric{font-size:28px;font-weight:800}.weekgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f4f4f0;border-radius:14px;padding:12px}.linkbtn{background:none;border:0;text-decoration:underline;padding:0;color:inherit}.topline{display:flex;justify-content:space-between;align-items:center}.learn{margin-top:12px;border-top:1px solid #eee;padding-top:10px}.learn summary{cursor:pointer;font-weight:700;font-size:14px}.learnbody{font-size:14px;line-height:1.55;color:#4f4f4a;padding-top:9px}.muscles{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.muscle{background:#eeeeea;border-radius:99px;padding:5px 8px;font-size:12px}.focus{margin:8px 0 0;padding-left:18px}.personal{background:#fff4e5;border-radius:10px;padding:9px;margin-top:9px;font-size:13px}.tutorial{background:#f6f6f2;border-radius:12px;padding:12px;margin-top:10px}.tutorial>summary{cursor:pointer;font-weight:700;list-style-position:outside}.tutorialbody{padding-top:8px}.tutorial ol,.tutorial ul{padding-left:20px}.fileinput{display:none}

<script>
const STORAGE='trainwise-v01';
const defaultState={profile:{weekdayMinutes:30,weekendMinutes:90,condition:'normal',raceDate:'2026-12-20',longRunBaselineMinutes:50},history:[],active:null};
let state=JSON.parse(JSON.stringify(defaultState));
try{const raw=localStorage.getItem(STORAGE);if(raw)state=JSON.parse(raw)||state}catch(e){}
const upperExercises=[
 {name:'滑輪下拉',en:'Lat Pulldown',role:'垂直拉',sets:3,weight:15,reps:8,tech:true,primary:['背闊肌'],secondary:['二頭肌','菱形肌／中下斜方肌'],focus:['胸口自然抬起，頸部維持中立','手肘往下、往身體兩側拉，不要只用手臂硬拉','回程控制重量，不要突然放掉'],personal:'你容易出現頸部代償：注意不要聳肩、不要為了把握把拉低而把頭往前伸。',why:'背部是目前的高優先目標；先用容易控制的垂直拉建立背部發力。'},
 {name:'機械胸推',en:'Chest Press',role:'水平推',sets:3,weight:10,reps:8,primary:['胸大肌'],secondary:['前三角肌','肱三頭肌'],focus:['握把大致與胸口同高','肩胛保持穩定，不要在推出時聳肩','手肘以肩膀舒服的角度推'],why:'保留水平推，讓上肢推拉訓練保持平衡。'},
 {name:'坐姿滑輪划船',en:'Seated Cable Row',role:'水平拉',sets:3,weight:10,reps:8,tech:true,primary:['背闊肌','菱形肌／中斜方肌'],secondary:['後三角肌','二頭肌'],focus:['軀幹保持穩定，不要前後甩動借力','想像手肘往後帶','拉到自然位置即可，不需要硬夾肩胛'],personal:'Focus 是頸部放鬆、肩膀遠離耳朵；如果越拉越聳肩，先減輕重量或縮短該組。',why:'提供第二次背部刺激，坐姿版本較容易控制軀幹與頸部代償。'},
 {name:'啞鈴肩推',en:'Dumbbell Shoulder Press',role:'垂直推',sets:2,weight:2.5,reps:8,tech:true,primary:['三角肌'],secondary:['肱三頭肌','上胸'],focus:['肋骨不要明顯外翻','向上推時不要刻意聳肩追求高度','使用能維持頸部自然的重量'],personal:'如果肩推時脖子明顯緊繃或聳肩，先不要加重量。',why:'你目前基準是每手 2.5 kg × 8；先以穩定完成為目標。'}
];
const fullBodyExercises=[
 {name:'高腳杯深蹲',en:'Goblet Squat',role:'深蹲',sets:3,weight:7.5,reps:8,tech:true,primary:['股四頭肌','臀大肌'],secondary:['核心','內收肌'],focus:['重量靠近胸前，腳掌穩定踩地','膝蓋方向跟腳尖一致','維持軀幹穩定，不追求超過可控制的深度'],why:'保留下肢基本力量與深蹲模式，同時比背槓深蹲更容易控制。'},
 {name:'羅馬尼亞硬舉',en:'Romanian Deadlift',role:'髖鉸鏈',sets:2,weight:5,reps:8,tech:true,primary:['腿後肌','臀大肌'],secondary:['豎脊肌','核心'],focus:['髖部往後移，不是蹲下','重量貼近腿部移動','背部與頸部維持自然中立'],why:'建立跑步需要的後側鏈力量與髖鉸鏈能力。'},
 {...upperExercises[0],sets:3},{...upperExercises[1],sets:3},{...upperExercises[2],sets:2},
 {name:'小腿提踵',en:'Calf Raise',role:'踝蹠屈',sets:2,weight:0,reps:12,primary:['腓腸肌','比目魚肌'],secondary:[],focus:['完整但可控制地抬起與下降','腳踝保持穩定，不要快速彈震'],why:'維持小腿與踝部能力，支援跑步。'},
 {name:'Pallof 抗旋轉推',en:'Pallof Press',role:'抗旋轉核心',sets:2,weight:5,reps:8,primary:['腹斜肌','腹橫肌'],secondary:['臀肌'],focus:['骨盆與胸口保持朝前','推出時不要被滑輪拉著旋轉','使用可以穩定呼吸的重量'],why:'以抗旋轉方式訓練核心控制，不需要大量下肢疲勞。'}
];
const tutorials={
'滑輪下拉':{setup:'坐穩後調整大腿墊固定雙腿；握把略寬於肩，手臂向上伸直但肩膀不要聳起。',steps:['胸口自然抬起、腹部保持穩定','手肘往下、往身體兩側拉，將握把帶向上胸附近','到可控制的位置停一下，再慢慢伸直手臂回程'],feel:'主要應感覺背闊肌與背部工作；手臂會輔助，但不應只有前臂或脖子很緊。',mistakes:['用身體大幅後仰把重量甩下來','聳肩或頭往前伸','回程直接讓配重掉回去']},
'機械胸推':{setup:'調整座椅，讓握把大致位於胸口高度；雙腳踩穩地面，背部貼穩靠墊。',steps:['肩胛自然穩定，握住把手','向前推出至手肘接近伸直，不需要鎖死','控制重量回到胸側'],feel:'主要是胸部，前三角與三頭肌會協助。',mistakes:['推出時聳肩','座椅高度讓握把過高或過低','回程失去控制']},
'坐姿滑輪划船':{setup:'雙腳踩穩踏板，坐直並握住把手；先用能保持軀幹穩定的重量。',steps:['保持胸口自然、頸部中立','手肘往後帶，把握把拉向軀幹','在自然終點停一下，再控制手臂往前伸'],feel:'主要應感覺中背與背闊肌工作，不需要刻意把肩胛夾到極限。',mistakes:['身體前後大幅擺動','聳肩拉重量','為了拉更遠而把頭往前伸']},
'啞鈴肩推':{setup:'坐姿可使用有靠背的椅子；每手持啞鈴，從肩膀附近開始。',steps:['腹部保持張力，肋骨不要明顯外翻','將啞鈴向上推至可控制的位置','慢慢下降回肩膀附近'],feel:'主要是肩膀，三頭肌會協助；不應以脖子緊繃作為主要感受。',mistakes:['為了推起重量過度拱腰','明顯聳肩','重量太重導致路徑失控']},
'高腳杯深蹲':{setup:'雙手把啞鈴垂直抱在胸前，雙腳約肩寬並找到舒服的腳尖角度。',steps:['吸氣並穩定軀幹','臀部與膝蓋一起彎曲向下蹲','腳掌持續踩穩，站回起始位置'],feel:'大腿前側與臀部工作，核心協助維持軀幹。',mistakes:['腳跟離地或腳掌失去穩定','膝蓋明顯向內塌','為追求深度而失去軀幹控制']},
'羅馬尼亞硬舉':{setup:'雙手持啞鈴放在大腿前方，雙腳約髖寬，膝蓋微彎。',steps:['屁股往後推，讓啞鈴沿腿部往下移','下降到腿後側有明顯拉伸、仍能維持背部中立的位置','用臀部與腿後側把髖伸直站回來'],feel:'腿後肌與臀部應有主要感受。',mistakes:['把動作做成深蹲','啞鈴離身體太遠','為了下得更低而圓背或抬頭']},
'小腿提踵':{setup:'可先用徒手或扶著固定物站立；雙腳約髖寬，前腳掌完整踩穩。',steps:['慢慢把腳跟抬高，像踮腳','頂端短暫停留','控制腳跟慢慢下降回起始位置'],feel:'應感覺小腿收縮與拉長；重點是控制，不是上下彈。',mistakes:['快速彈震借力','腳踝向內或向外倒','只做很小的活動範圍']},
'Pallof 抗旋轉推':{setup:'把 Cable 調到胸口高度，身體側面朝向滑輪；雙手把握把拉到胸前，往旁邊走到有適度張力。',steps:['雙腳站穩、胸口與骨盆保持朝正前方','腹部收緊後，把雙手慢慢往正前方推出','Cable 會把你往旁邊拉，但身體不要跟著旋轉','停一下，再把手慢慢收回胸前'],feel:'應感覺核心在抵抗旋轉，而不是靠手臂硬推。',mistakes:['身體被 Cable 拉轉','重量太重導致整個人歪掉','聳肩或憋氣到無法穩定控制']}
};
const library=[...upperExercises,...fullBodyExercises].reduce((a,e)=>{let t=tutorials[e.name]||{};a[e.name]={...e,...t};return a},{});
function hydrateExercise(e){if(e.name==='Pallof Press')e={...e,name:'Pallof 抗旋轉推',en:'Pallof Press'};let m=library[e.name];return m?{...m,...e,primary:m.primary||[],secondary:m.secondary||[],focus:m.focus||[],personal:m.personal||'',why:m.why||e.why,setup:m.setup||'',steps:m.steps||[],feel:m.feel||'',mistakes:m.mistakes||[]}:e}
function classify(h){if(h.sessionKind)return h.sessionKind;if(h.type==='run')return /Long/i.test(h.title||'')?'long_run':'short_run';if(h.type==='strength')return /Full/i.test(h.title||'')?'full_body':'upper';return 'unknown'}
function migrateState(){state.profile={...defaultState.profile,...(state.profile||{})};state.history=(state.history||[]).map(h=>{let x={...h,sessionKind:classify(h)};if(x.type==='strength'&&Array.isArray(x.exercises))x.exercises=x.exercises.map(hydrateExercise);return x});if(state.active?.type==='strength'&&Array.isArray(state.active.exercises))state.active.exercises=state.active.exercises.map(hydrateExercise)}
migrateState();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function todayMinutes(){let d=new Date().getDay();return d===0||d===6?state.profile.weekendMinutes:state.profile.weekdayMinutes}
function weekStart(d=new Date()){let x=new Date(d);x.setHours(0,0,0,0);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function thisWeek(){let ws=weekStart();return state.history.filter(h=>new Date(h.date)>=ws)}
function counts(){let c={upper:0,full_body:0,short_run:0,long_run:0};thisWeek().forEach(h=>{let k=classify(h);if(k in c)c[k]++});return c}
function latestKind(k){return [...state.history].reverse().find(h=>classify(h)===k)}
function daysSince(h){return h?(Date.now()-new Date(h.date).getTime())/86400000:999}
function parseDurationMinutes(v){if(!v)return 0;let s=String(v).trim();if(/^\\d+(?:\\.\\d+)?$/.test(s))return Number(s);let p=s.split(':').map(Number);if(p.some(Number.isNaN))return 0;if(p.length===2)return p[0]+p[1]/60;if(p.length===3)return p[0]*60+p[1]+p[2]/60;return 0}
function daysUntilRace(){let race=new Date((state.profile.raceDate||'2026-12-20')+'T00:00:00');return Math.ceil((race-new Date())/86400000)}
function longRunTargetMinutes(){
 let prev=latestKind('long_run'),base=Number(state.profile.longRunBaselineMinutes||50),days=daysUntilRace();
 if(!prev){
   if(days<=10)return 60;
   return base;
 }
 let prevTarget=Number(prev.targetMinutes||parseDurationMinutes(prev.duration)||base);
 let actual=parseDurationMinutes(prev.duration);
 let enjoyment=prev.enjoyment||'good';
 if(days<=10)return Math.min(70,Math.max(45,Math.round(prevTarget*0.6/5)*5));
 if(prev.effort==='hard'||enjoyment==='bad'||prev.discomfort===true)return Math.max(45,prevTarget-10);
 if(prev.effort==='moderate'||enjoyment==='neutral'||(actual&&actual<prevTarget*0.85))return prevTarget;
 // Every fourth completed long run is a recovery week rather than endless linear progression.
 let completed=state.history.filter(h=>classify(h)==='long_run').length;
 if(completed>0&&completed%4===3)return Math.max(50,Math.round(prevTarget*0.8/5)*5);
 return Math.min(120,prevTarget+(days>21?15:10));
}
function sessionMeta(k){let lm=longRunTargetMinutes();return {upper:{type:'strength',title:'Upper Strength',detail:'背 / 胸 / 肩',mins:'約 30 min'},short_run:{type:'run',title:'Easy Run',detail:'舒服跑 · 不追配速',mins:'30 min'},full_body:{type:'strength',title:'Full Body',detail:'上肢 + 跑者下肢 + 核心',mins:'約 60–75 min'},long_run:{type:'run',title:'Easy Long Run',detail:`${lm} min · 不追配速`,mins:'距離只做紀錄'}}[k]}
function recommend(){let mins=todayMinutes(),c=counts(),cond=state.profile.condition;let weekend=mins>=60;let eligible=weekend?['long_run','full_body','upper','short_run']:['upper','short_run'];let score={upper:0,short_run:0,full_body:0,long_run:0},reason={};
 score.upper+=(c.upper<1?70:15)+(daysSince(latestKind('upper'))>3?20:0);reason.upper='本週需要上肢刺激，而且背部是目前的高優先目標。';
 score.short_run+=(c.short_run<1?65:15)+(daysSince(latestKind('short_run'))>3?15:0);reason.short_run='本週需要一次短跑，以低強度累積半馬所需的有氧基礎。';
 score.full_body+=(c.full_body<1?75:10)+(daysSince(latestKind('full_body'))>5?15:0);reason.full_body='週末較長時段適合完成上肢、跑者下肢與核心的完整力量訓練。';
 score.long_run+=(c.long_run<1?90:10)+(daysSince(latestKind('long_run'))>6?15:0);reason.long_run='Long Run 是目前從 5K 往半馬建立耐力的主要訓練，本週尚未完成時優先度較高。';
 let lf=latestKind('full_body'),ll=latestKind('long_run');if(daysSince(lf)<1.5){score.long_run-=55;reason.long_run='最近剛完成 Full Body，下肢仍可能有殘留疲勞，因此不優先緊接 Long Run。'}if(daysSince(ll)<1.5){score.full_body-=45;reason.full_body='最近剛完成 Long Run，因此今天降低下肢負荷，不優先安排 Full Body。'}
 if(cond==='tired'){score.long_run-=80;score.full_body-=60;score.short_run-=15;score.upper+=10;reason.upper='你今天回報很累，因此避免高下肢／高耐力負荷；若仍想訓練，較短的 Upper 比較合適。'}
 let ordered=eligible.sort((a,b)=>score[b]-score[a]);let k=ordered[0],m=sessionMeta(k);return {kind:k,...m,why:reason[k],alternatives:ordered.slice(1,3).map(x=>({kind:x,...sessionMeta(x)}))}}
function condition(x){state.profile.condition=x;save();renderToday()}
function renderToday(){let r=recommend(),mins=todayMinutes();document.querySelector('#today').innerHTML=`<div class="topline"><div><div class="muted">TRAINING · V0.11</div><h1>今天</h1></div><span class="pill">${mins} min</span></div><div class="card hero"><div class="muted" style="color:#aaa">RECOMMENDED</div><h2>${r.title}</h2><p>${r.detail} · ${r.mins}</p><div class="why"><b>Why?</b><br>${r.why}</div><br><button class="btn primary" style="background:#fff;color:#111" onclick="start('${r.kind}')">開始訓練</button></div><div class="card"><b>今天狀態</b><p class="muted">狀態只影響今天的排序，不會把一次疲勞當成退步。</p><div class="choice">${['good','normal','tired'].map(x=>`<button class="${state.profile.condition===x?'sel':''}" onclick="condition('${x}')">${{good:'很好',normal:'普通',tired:'很累'}[x]}</button>`).join('')}</div></div><div class="card"><b>其他選擇</b>${r.alternatives.map(a=>`<p><button class="linkbtn" onclick="start('${a.kind}')">${a.title} →</button></p>`).join('')}<p class="muted">推薦是排序，不是限制；你仍可選擇其他訓練。</p></div>`}
function previousExercise(name){for(let i=state.history.length-1;i>=0;i--){let h=state.history[i];if(h.type!=='strength')continue;let e=(h.exercises||[]).find(x=>x.name===name);if(e)return e}return null}
function progressionFor(e){let prev=previousExercise(e.name);if(!prev)return {weight:e.weight,reps:e.reps,reason:'目前沒有這個動作的歷史紀錄，先從基準重量與 reps 建立穩定動作品質。'};let done=(prev.actual||[]).filter(s=>s.done);if(!done.length)return {weight:e.weight,reps:e.reps,reason:'上次沒有完成有效組數，因此維持起始目標。'};let counts={};done.forEach(s=>{let w=Number(s.weight);counts[w]=(counts[w]||0)+1});let ww=Object.keys(counts).map(Number).sort((a,b)=>(counts[b]-counts[a])||(a-b))[0];let ws=done.filter(s=>Number(s.weight)===ww),min=Math.min(...ws.map(s=>Number(s.reps)||0));if(prev.technique==='pain')return {weight:ww,reps:Math.max(6,min),reason:`上次以 ${ww} kg 記錄到疼痛，因此不增加負荷。`};if(prev.technique==='compensation')return {weight:ww,reps:Math.max(8,min),reason:`上次以 ${ww} kg 完成，但有代償；這次先維持重量與動作品質。`};if(ws.length>=prev.sets&&min>=12)return {weight:ww,reps:12,reason:`上次已用 ${ww} kg 穩定完成完整 rep range。這次可以維持，也可以在動作品質舒服、沒有頸部代償時自行嘗試小幅加重；不需要為了 progression 勉強加重量。`};let next=Math.min(12,Math.max(8,min+1));return {weight:ww,reps:next,reason:`上次 working weight 是 ${ww} kg，最低完成 ${min} reps；這次維持重量並嘗試 ${next} reps。`}}
function applyProgression(xs,kind){let reduceLower=kind==='full_body'&&daysSince(latestKind('long_run'))>5&&counts().long_run<1;return xs.map(e=>{let p=progressionFor(e),sets=e.sets;if(reduceLower&&['深蹲','髖鉸鏈','踝蹠屈'].includes(e.role))sets=Math.max(1,sets-1);return {...e,sets,progressionReason:p.reason,actual:Array.from({length:sets},()=>({weight:p.weight,reps:p.reps,done:false})),technique:'good'}})}
function start(kind){let m=sessionMeta(kind);if(kind==='upper'||kind==='full_body'){let xs=kind==='upper'?upperExercises:fullBodyExercises;state.active={type:'strength',sessionKind:kind,title:m.title,started:new Date().toISOString(),exercises:applyProgression(xs,kind)}}else{let targetMinutes=kind==='long_run'?longRunTargetMinutes():null;state.active={type:'run',sessionKind:kind,title:m.title,started:new Date().toISOString(),targetMinutes,distance:'',duration:'',effort:'easy',enjoyment:'good'}}save();show('workout');renderWorkout()}
function exerciseCard(e,ei){return `<div class="card"><div class="topline"><div><b>${e.name}</b><div class="muted">${e.en||''} · ${e.role}</div></div><span class="pill">${e.sets} sets</span></div>${e.actual.map((s,si)=>`<div class="setrow"><span>${si+1}</span><input type="number" step="0.5" value="${s.weight}" onchange="upd(${ei},${si},'weight',this.value)"><input type="number" value="${s.reps}" onchange="upd(${ei},${si},'reps',this.value)"><button class="done ${s.done?'checked':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}<div class="muted" style="padding-left:34px">kg　　　　　　　　 reps</div><div class="why"><b>Why this exercise?</b> ${e.why}<br><br><b>Why this target?</b> ${e.progressionReason}</div><details class="learn"><summary>練哪裡 ＆ 姿勢 Focus</summary><div class="learnbody"><b>主要訓練</b><div class="muscles">${(e.primary||[]).map(x=>`<span class="muscle">${x}</span>`).join('')}</div>${e.secondary?.length?`<b>輔助肌群</b><div class="muscles">${e.secondary.map(x=>`<span class="muscle">${x}</span>`).join('')}</div>`:''}<b>姿勢 Focus</b><ul class="focus">${(e.focus||[]).map(x=>`<li>${x}</li>`).join('')}</ul>${e.personal?`<div class="personal"><b>你的注意事項</b><br>${e.personal}</div>`:''}<details class="tutorial"><summary>第一次做？完整教學</summary><div class="tutorialbody">${e.setup?`<p><b>器材／起始設定</b><br>${e.setup}</p>`:''}${e.steps?.length?`<b>怎麼做</b><ol>${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${e.feel?`<p><b>應該感覺哪裡</b><br>${e.feel}</p>`:''}${e.mistakes?.length?`<b>常見錯誤</b><ul>${e.mistakes.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<p><a href="https://www.youtube.com/results?search_query=${encodeURIComponent((e.en||e.name)+' exercise tutorial proper form')}" target="_blank" rel="noopener noreferrer">看影片示範 ↗</a></p></div></details></div></details>${e.tech?`<div style="margin-top:12px"><span class="muted">動作品質</span><div class="choice">${[['good','穩定'],['compensation','有代償'],['pain','疼痛']].map(([v,l])=>`<button class="${e.technique===v?'sel':''}" onclick="tech(${ei},'${v}')">${l}</button>`).join('')}</div></div>`:''}</div>`}
function renderWorkout(){let a=state.active;if(!a){show('today');return}if(a.type==='run'){let isLong=a.sessionKind==='long_run';document.querySelector('#workout').innerHTML=`<div class="muted">RUN</div><h1>${a.title}</h1>${isLong?`<div class="why"><b>今天的方向</b><br>舒服活動約 ${Number(a.targetMinutes||longRunTargetMinutes())} 分鐘，不追配速。可以慢跑，也可以途中走一下；距離只是紀錄。若今天身體覺得不對，提早結束也算完成。</div>`:''}<div class="card"><label>距離 km（只做紀錄）</label><input style="width:100%;padding:14px;margin:7px 0 14px;border:1px solid #ddd;border-radius:12px;font-size:18px" value="${a.distance||''}" onchange="state.active.distance=this.value;save()"><label>時間</label><input placeholder="例如 55:20" style="width:100%;padding:14px;margin:7px 0 14px;border:1px solid #ddd;border-radius:12px;font-size:18px" value="${a.duration||''}" onchange="state.active.duration=this.value;save()"><b>跑起來的強度</b><div class="choice" style="margin-top:8px">${['easy','moderate','hard'].map(x=>`<button class="${a.effort===x?'sel':''}" onclick="state.active.effort='${x}';save();renderWorkout()">${{easy:'Easy',moderate:'Moderate',hard:'Hard'}[x]}</button>`).join('')}</div><br><b>今天運動的感覺</b><div class="choice" style="margin-top:8px">${[['love','😊 喜歡'],['good','🙂 還不錯'],['neutral','😐 普通'],['bad','😣 不喜歡']].map(([v,l])=>`<button class="${a.enjoyment===v?'sel':''}" onclick="state.active.enjoyment='${v}';save();renderWorkout()">${l}</button>`).join('')}</div></div><button class="btn primary" onclick="finishRun()">完成跑步</button>`;return}document.querySelector('#workout').innerHTML=`<div class="muted">STRENGTH</div><h1>${a.title}</h1><p>${a.sessionKind==='full_body'?'上肢 + 跑者下肢 + 核心。舒服、穩定的動作品質優先於重量。':'背部優先；完成原定內容時只需要按 ✓，不需要為了數字勉強加重。'}</p>${a.exercises.map(exerciseCard).join('')}<div class="card"><b>今天運動的感覺</b><div class="choice" style="margin-top:8px">${[['love','😊 喜歡'],['good','🙂 還不錯'],['neutral','😐 普通'],['bad','😣 不喜歡']].map(([v,l])=>`<button class="${(a.enjoyment||'good')===v?'sel':''}" onclick="state.active.enjoyment='${v}';save();renderWorkout()">${l}</button>`).join('')}</div></div><button class="btn primary" onclick="finishStrength()">完成訓練</button><br><br><button class="btn secondary" onclick="finishStrength(true)">提早結束，也保存已完成內容</button>`}
function upd(e,s,k,v){state.active.exercises[e].actual[s][k]=+v;save()}function toggleSet(e,s){state.active.exercises[e].actual[s].done=!state.active.exercises[e].actual[s].done;save();renderWorkout()}function tech(e,v){state.active.exercises[e].technique=v;save();renderWorkout()}
function finishStrength(early=false){let a=state.active;state.history.push({type:'strength',sessionKind:a.sessionKind,date:new Date().toISOString(),title:a.title,early,enjoyment:a.enjoyment||'good',exercises:a.exercises});state.active=null;save();show('history');renderHistory();renderWeek()}
function finishRun(){let a=state.active;state.history.push({type:'run',sessionKind:a.sessionKind,date:new Date().toISOString(),title:a.title,targetMinutes:a.targetMinutes,distance:a.distance,duration:a.duration,effort:a.effort,enjoyment:a.enjoyment||'good'});state.active=null;save();show('history');renderHistory();renderWeek()}
function renderWeek(){let c=counts();let items=[['Upper',c.upper],['Full Body',c.full_body],['Short Run',c.short_run],['Long Run',c.long_run]];document.querySelector('#week').innerHTML=`<div class="muted">WEEKLY OBJECTIVES</div><h1>本週</h1><div class="weekgrid">${items.map(([n,v])=>`<div class="metric"><div class="bigmetric">${Math.min(v,1)}/1</div><div>${n}</div></div>`).join('')}</div><div class="card"><b>不是補課系統</b><p>週一重新開始 objective；沒完成不會標記失敗。Today 只根據你實際做過的內容重新排序下一個合適 session。</p></div>`}
function renderHistory(){let html=state.history.length?[...state.history].reverse().map(x=>`<div class="card"><b>${x.title}</b><div class="muted">${new Date(x.date).toLocaleString('zh-TW')}</div>${x.type==='run'?`<p>${x.distance||'—'} km · ${x.duration||'—'} · ${x.effort}</p>`:`<p>${x.exercises.reduce((n,e)=>n+(e.actual||[]).filter(s=>s.done).length,0)} completed sets${x.early?' · 提早結束':''}</p>`}</div>`).join(''):'<div class="card"><p>還沒有紀錄。</p></div>';document.querySelector('#history').innerHTML=`<div class="muted">TRAINING HISTORY</div><h1>紀錄</h1>${html}`}
function exportData(){let payload={app:'Trainwise',version:11,exportedAt:new Date().toISOString(),state};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`trainwise-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result),incoming=payload.state||payload;if(!incoming||!Array.isArray(incoming.history)||typeof incoming.profile!=='object')throw new Error('invalid');if(!confirm(`匯入後會取代目前本機資料。備份包含 ${incoming.history.length} 筆訓練紀錄，確定匯入？`))return;state=incoming;migrateState();save();renderAll();show(state.active?'workout':'today');if(state.active)renderWorkout();alert('匯入完成。')}catch(e){alert('無法匯入：這不是有效的 Trainwise 備份檔。')}finally{input.value=''}};reader.readAsText(file)}
function renderProfile(){document.querySelector('#profile').innerHTML=`<div class="muted">PROFILE</div><h1>訓練設定</h1><div class="card"><b>目前目標</b><p>愛上運動 · 12/20 台北馬半馬完賽 · Easy 跑不追速度 · 上肢增肌 · 背部優先 · 功能性 · 久坐改善</p></div><div class="card"><b>時間</b><p>平日 ${state.profile.weekdayMinutes} min · 週末 ${state.profile.weekendMinutes} min<br>Baseline：每週 4 個正式 training slots</p></div><div class="card"><b>目前基準</b><p>高腳杯深蹲 · 7.5 kg × 8<br>啞鈴肩推 · 2.5 kg/手 × 8<br>單臂啞鈴划船 · 5 kg × 8<br>Running · Easy Long Run baseline 50 min / 約 5K</p></div><div class="alert">背槓深蹲目前設為「不優先推薦」。拉類與肩部動作若出現頸部代償，progression 會暫停。</div><br><button class="btn primary" onclick="exportData()">匯出訓練資料</button><br><br><label class="btn secondary" style="display:block;text-align:center">匯入備份<input class="fileinput" type="file" accept="application/json,.json" onchange="importData(this)"></label><p class="muted">資料仍只存在這個瀏覽器；匯出 JSON 可在換手機、清除瀏覽器資料前備份。</p><button class="btn secondary" onclick="if(confirm('清除 prototype 的所有本機紀錄？')){try{localStorage.removeItem(STORAGE)}catch(e){};state=JSON.parse(JSON.stringify(defaultState));renderAll();show('today')}">重設 Prototype</button>`}
function show(id){['today','workout','week','history','profile'].forEach(x=>document.querySelector('#'+x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}
function renderAll(){renderToday();renderWeek();renderHistory();renderProfile()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{show(b.dataset.page);({today:renderToday,week:renderWeek,history:renderHistory,profile:renderProfile}[b.dataset.page]||(()=>{}))()});renderAll();if(state.active){show('workout');renderWorkout()}
</script></body></html>
